server {  
  listen 80;  
  server_name _;  
  
  root C:/nginx/html/quanlysu5;  
  index index.html;  
  
  add_header X-Content-Type-Options "nosniff" always;  
  add_header X-Frame-Options "SAMEORIGIN" always;  
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;  
  
  gzip on;  
  gzip_vary on;  
  gzip_comp_level 6;  
  gzip_min_length 1024;  
  gzip_proxied any;  
  gzip_types  
    text/plain text/css text/javascript  
    application/javascript application/json application/xml  
    image/svg+xml font/ttf font/woff font/woff2;  
  
  # SPA fallback  
  location / {  
    try_files $uri $uri/ /index.html;  
  }  
  
  # Reverse proxy toi backend jar (port 8081, context-path /api)  
  location /api/ {  
    proxy_pass http://127.0.0.1:8081/api/;  
    proxy_set_header Host $host;  
    proxy_set_header X-Real-IP $remote_addr;  
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  
    proxy_set_header X-Forwarded-Proto $scheme;  
  }  
  
  # WebSocket -> backend port 8081  
  # LUU Y: neu backend map WS duoi context-path /api thi doi thanh /api/ws/  
  location /ws/ {  
    proxy_pass http://127.0.0.1:8081/ws/;  
    proxy_http_version 1.1;  
    proxy_set_header Upgrade $http_upgrade;  
    proxy_set_header Connection "upgrade";  
    proxy_set_header Host $host;  
    proxy_read_timeout 3600s;  
  }  
  
  # Cache tai nguyen tinh  
  location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {  
    expires 1y;  
    add_header Cache-Control "public, max-age=31536000, immutable";  
    add_header X-Content-Type-Options "nosniff" always;  
    try_files $uri =404;  
  }  
  
  # index.html khong cache  
  location = /index.html {  
    add_header Cache-Control "no-cache, no-store, must-revalidate";  
    add_header X-Content-Type-Options "nosniff" always;  
    add_header X-Frame-Options "SAMEORIGIN" always;  
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;  
  }  
}